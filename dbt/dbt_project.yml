name: settlement
version: "1.0.0"
config-version: 2
profile: settlement

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Business rules and run context. Overridden per-run via `--vars` from the CLI
# / Airflow. Defaults let `dbt build` work standalone during development.
vars:
  reference_date: "2025-03-16"
  run_id: "manual"
  reconciliation_tolerance: 0.01
  reconciliation_window_days: 7
  mismatch_rate_warn: 0.10
  orphan_rate_warn: 0.05

models:
  settlement:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
