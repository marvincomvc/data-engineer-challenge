version: 2

models:
  - name: stg_transactions
    description: Internal transactions, current state after CDC collapse.
    columns:
      - name: transaction_id
        description: Natural key.
        tests:
          - not_null       # integrity -> blocks
          - unique         # CDC collapse must yield one row per txn
      - name: amount
        tests:
          - not_null
      - name: currency
        tests:
          - accepted_values:
              values: ["BRL", "USD", "EUR"]

  - name: stg_paysettler
    description: Cleaned PaySettler settlement file.
    columns:
      - name: transaction_id
        tests:
          - not_null
      - name: amount
        description: Unparseable amounts become NULL and are caught here (blocks).
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ["SETTLED", "REVERSED"]
      - name: settled_at
        description: >
          A settlement with an unparseable timestamp (NULL) is dropped from the
          per-date reconciliation scope; warn so it can't vanish unaudited.
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_settlements
    description: Canonical settlement stream (union of processor adapters) fed to the engine.
    columns:
      - name: transaction_id
        tests: [not_null]
      - name: amount
        tests: [not_null]
      - name: source_system
        tests: [not_null]

  - name: stg_reconciliation_runs
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              values: ["IN_PROGRESS", "COMPLETED", "FAILED"]

  - name: stg_enterprise_company
    columns:
      - name: merchant_id
        tests: [not_null, unique]
