[project]
name = "data-engineer-challenge"
version = "0.1.0"
description = "Settlement Reconciliation — data products pipeline (DuckDB + dbt + Airflow)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.0",
    "pyarrow>=18.0",
    "dbt-duckdb>=1.9.2",   # 1.9.2 adds Python 3.12 support
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]
# Airflow is heavy and runs in its own container; kept out of the default install.
airflow = [
    "apache-airflow>=2.9,<3.1",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
