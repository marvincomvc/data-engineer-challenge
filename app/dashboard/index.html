<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CFO Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Inter, sans-serif;
            background: #F5F7FA;
            color: #1E293B;

        }


        header {

            background: white;
            padding: 25px 40px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .05);

        }


        header h1 {

            font-size: 28px;

        }


        header span {

            color: #64748B;

        }



        .container {

            padding: 30px;

        }



        .cards {

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;

        }



        .card {

            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .05);

        }



        .card h3 {

            color: #64748B;
            font-size: 14px;

        }


        .value {

            margin-top: 15px;
            font-size: 32px;
            font-weight: 700;

        }



        .grid {

            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;

        }



        .box {

            background: white;
            border-radius: 15px;
            padding: 25px;

        }



        .box h2 {

            font-size: 18px;
            margin-bottom: 20px;

        }



        table {

            width: 100%;
            border-collapse: collapse;

        }


        th {

            background: #F1F5F9;
            padding: 12px;
            text-align: left;

        }


        td {

            padding: 12px;
            border-bottom: 1px solid #eee;

        }



        @media(max-width:1000px) {

            .cards {

                grid-template-columns: repeat(2, 1fr);

            }


            .grid {

                grid-template-columns: 1fr;

            }


        }
    </style>

</head>


<body>


    <header>

        <h1>Dashboard Financeiro</h1>

        <span>
            Visão executiva CFO - Settlement Platform
        </span>

    </header>



    <div class="container">


        <div class="cards">


            <div class="card">

                <h3>Total Transações</h3>

                <div id="transactions" class="value">
                    -
                </div>

            </div>



            <div class="card">

                <h3>Volume Processado</h3>

                <div id="volume" class="value">
                    -
                </div>

            </div>



            <div class="card">

                <h3>Taxa Reconciliação</h3>

                <div id="match" class="value">
                    -
                </div>

            </div>



            <div class="card">

                <h3>Diferença Financeira</h3>

                <div id="difference" class="value">
                    -
                </div>

            </div>


        </div>



        <div class="grid">


            <div class="box">

                <h2>Volume Financeiro por Dia</h2>

                <canvas id="volumeChart"></canvas>

            </div>



            <div class="box">

                <h2>Status Reconciliação</h2>

                <canvas id="statusChart"></canvas>

            </div>



            <div class="box">

                <h2>Top Merchants</h2>


                <table>

                    <thead>

                        <tr>

                            <th>Merchant</th>

                            <th>Volume</th>

                        </tr>

                    </thead>


                    <tbody id="merchantTable">

                    </tbody>


                </table>


            </div>



            <div class="box">

                <h2>Evolução Reconciliação</h2>

                <canvas id="trendChart"></canvas>


            </div>



        </div>



    </div>




    <script>


        async function loadDashboard() {


            const response = await fetch("/api/dashboard");


            const data = await response.json();



            document.getElementById("transactions").innerHTML =
                data.kpis.transactions;



            document.getElementById("volume").innerHTML =
                "R$ " + data.kpis.volume.toLocaleString();



            document.getElementById("match").innerHTML =
                data.kpis.match_rate + "%";



            document.getElementById("difference").innerHTML =
                "R$ " + data.kpis.difference.toLocaleString();




            new Chart(
                document.getElementById("volumeChart"),
                {

                    type: "bar",

                    data: {

                        labels: data.daily.date,

                        datasets: [{

                            label: "Volume",

                            data: data.daily.volume

                        }]

                    }

                });




            new Chart(
                document.getElementById("statusChart"),
                {

                    type: "doughnut",

                    data: {

                        labels: Object.keys(data.status),

                        datasets: [{

                            data: Object.values(data.status)

                        }]

                    }

                });





            const table =
                document.getElementById("merchantTable");



            data.merchants.forEach(m => {


                let row = document.createElement("tr");


                row.innerHTML = `

<td>${m.name}</td>

<td>
R$ ${m.volume.toLocaleString()}
</td>

`;


                table.appendChild(row);


            });





            new Chart(
                document.getElementById("trendChart"),
                {

                    type: "line",

                    data: {

                        labels: data.daily.date,

                        datasets: [{

                            label: "Match %",

                            data: data.daily.match_rate

                        }]

                    }

                });



        }



        loadDashboard();



    </script>



</body>

</html>
