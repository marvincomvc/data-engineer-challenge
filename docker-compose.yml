services:

  pipeline:

    build: .

    container_name: settlement-pipeline

    volumes:

      - ./app:/app/app

      - ./data:/app/data

      - ./duckdb-data:/app/duckdb-data

      - ./docs/sample-data:/app/raw


    environment:

      DUCKDB_PATH: /app/duckdb-data/warehouse.duckdb

      DATA_PATH: /app/data

      BRONZE_PATH: /app/data/bronze


    command:

      [
        "uv",
        "run",
        "python",
        "app/main.py"
      ]


  dashboard:
    build: .
    command: uv run python app/dashboard/main.py
    ports:
      - "8000:8000"
    volumes:
      - ./duckdb-data:/app/duckdb-data